<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="link top-link">
                <img src="images/view-dashboard.svg" alt="dashboard" class="icon">
                <a href="">Dashboard</a>
            </div>

            <div class="general">
                <div class="link">
                    <img src="images/home.svg" alt="home" class="icon">
                    <a href="">Home</a>
                </div>

                <div class="link">
                    <img src="images/card-account-details-outline.svg" alt="account" class="icon">    
                    <a href="">Profile</a>
                </div>

                <div class="link">
                    <img src="images/message-reply.svg" alt="messages" class="icon">
                    <a href="">messages</a>
                </div>

                <div class="link">
                    <img src="images/clock-time-three.svg" alt="history" class="icon">
                    <a href="">History</a>
                </div>

                <div class="link">
                    <img src="images/note-multiple.svg" alt="tasks" class="icon">
                    <a href="">Tasks</a>  
                </div>

                <div class="link">
                    <img src="images/account-group.svg" alt="communities" class="icon">
                    <a href="">Communities</a>
                </div>
            </div>

            <div class="help">
                <div class="link">
                    <img src="images/cog.svg" alt="settings" class="icon">
                    <a href="">Settings</a>
                </div>

                <div class="link">
                    <img src="images/help-box.svg" alt="" class="icon">
                    <a href="">Support</a>
                </div>

                <div class="link">
                    <img src="images/shield-check.svg" alt="" class="icon">
                    <a href="">Privacy</a>
                </div>
            </div>

        </div>


        <div class="header">
            <div class="search">Search</div>
            <div class="profile-icon">Profile Icon</div>
            <div class="title">Title</div>
            <div class="buttons">Buttons</div>
        </div>


        <div class="main-content">

            <div class="project">Your Projects</div>

            <div class="announcement">Announcements</div>

            <div class="trend">Trending</div>
        </div>
    </div>
</body>
</html>
